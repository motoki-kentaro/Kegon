name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the repository. No release, tag, PR update or secret is involved.
permissions:
  contents: read

# A newer push to the same ref supersedes a run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short
  # Pinned so a new stable release cannot turn `clippy -D warnings` red on its own.
  # Cargo.toml's rust-version (1.88) is the minimum; this is the version Kegon is developed on.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Use the pinned toolchain
        run: |
          rustup default "$env:RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # PowerShell 7 / Windows PowerShell 5.1 + ConPTY Shell Integration (the #[ignore]d tests).
      - name: Windows PowerShell ConPTY E2E
        timeout-minutes: 15
        run: |
          & cargo test --locked -- powershell --ignored 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed with exit code $LASTEXITCODE" }
          $text = $log | Out-String
          $m = [regex]::Matches($text, 'test result: ok\. (\d+) passed; (\d+) failed')
          if ($m.Count -eq 0) { throw 'no "test result: ok" line found' }
          $passed = ($m | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Sum).Sum
          Write-Host "PowerShell ConPTY E2E: $passed passed"
          if ($passed -lt 6) { throw "expected at least 6 PowerShell E2E tests, ran $passed" }

      - name: Build release
        run: cargo build --release --locked

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libasound2-dev: cpal (Dopamine Mode audio). The shells are what the Unix Shell Integration E2E drives.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            pkg-config \
            bash \
            zsh \
            fish
          bash --version | head -n 1
          zsh --version
          fish --version

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Use the pinned toolchain
        run: |
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # These are plain tests, already part of `cargo test`; run on their own so a silent 0-test run is caught.
      - name: Unix PTY tests
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cargo test --locked unix_pty 2>&1 | tee "$RUNNER_TEMP/unix_pty.log"
          passed=$(grep -oE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/unix_pty.log" | awk '{s+=$4} END{print s+0}')
          echo "Unix PTY: ${passed:-0} passed"
          test "${passed:-0}" -ge 10

      # bash / zsh / fish Shell Integration against a real PTY (the #[ignore]d tests).
      - name: Unix Shell Integration E2E
        timeout-minutes: 15
        env:
          TERM: xterm-256color
        run: |
          set -euo pipefail
          cargo test --locked -- --ignored unix_shell 2>&1 | tee "$RUNNER_TEMP/unix_shell.log"
          passed=$(grep -oE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/unix_shell.log" | awk '{s+=$4} END{print s+0}')
          echo "Unix Shell Integration E2E: ${passed:-0} passed"
          test "${passed:-0}" -ge 16

      - name: Build release
        run: cargo build --release --locked
