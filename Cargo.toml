[package]
name = "kegon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native, Git-native terminal workspace, written in Rust."
repository = "https://github.com/motoki-kentaro/Kegon"
publish = false

[dependencies]
iced = { version = "0.14", features = ["svg", "canvas", "advanced"] }
# Decodes the embedded application icon for the window.
ico = "0.4"
# Localization: Fluent bundles, locale tags, and the OS locale (see docs/architecture/i18n.md).
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
# Terminal core emulation and system clipboard
alacritty_terminal = "0.26.0"
arboard = "3.6.1"
# Application settings serialization, TOML parsing, and cross-platform config paths
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
# Cross-platform system font enumeration and font file/face metadata parsing
fontdb = "0.23"
ttf-parser = "0.25"

[build-dependencies]
# Embeds the application icon into the Windows executable (see build.rs).
winresource = "0.1"

[dev-dependencies]
# Lists the message IDs in a Fluent resource, for the i18n completeness tests.
fluent-syntax = "0.12"
